plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

fabricApi {
	configureDataGeneration()
}

loom {
	accessWidenerPath = file("src/main/resources/blocktopia.accesswidener")

	runs {
		datagen {
			inherit client
		}
	}
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	maven {
		url = 'https://maven.minecraftforge.net/'
	}
	maven {
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url = "https://maven.kyrptonaught.dev"
	}
	maven {
		name = "Progwml6's maven"
		url = "https://dvs1.progwml6.com/files/maven/"
	}
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
	modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
	modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modImplementation "maven.modrinth:more_tools_and_armor:${project.more_tools_and_armor_version}"
	modCompileOnly "maven.modrinth:simple-copper-pipes:2.0.6-mc1.21.1"
	modRuntimeOnly "maven.modrinth:frozenlib:2.1.7-mc1.21.1"
	modRuntimeOnly "maven.modrinth:fabric-language-kotlin:1.13.5+kotlin.2.2.10"

	modImplementation "com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.terraform_wood_api_version}"
	include "com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.terraform_wood_api_version}"

	modImplementation "net.kyrptonaught:customportalapi:${project.custom_portal_api_version}"
	include "net.kyrptonaught:customportalapi:${project.custom_portal_api_version}"

	modRuntimeOnly "maven.modrinth:continuity:${project.continuity_version}"

	//modImplementation "mezz.jei:jei-1.21.1-common-api:${jei_version}"
	//modRuntimeOnly "mezz.jei:jei-1.21.1-fabric:${jei_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}